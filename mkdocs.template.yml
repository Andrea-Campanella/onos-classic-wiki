site_name: ONOS Wiki
site_url: https://YOUR_GITHUB_USERNAME.github.io/onos-classic-wiki/
repo_url: https://github.com/YOUR_GITHUB_USERNAME/onos-classic-wiki
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - search.highlight
markdown_extensions:
  - tables
  - fenced_code
  - toc:
      permalink: true
  - admonition
  - attr_list
extra_css: []
